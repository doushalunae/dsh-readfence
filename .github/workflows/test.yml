name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    # The policy tests use Windows-style paths (C:\...), so the suite runs on
    # Windows only; add a matrix entry here after making the fixtures portable.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node test/all.test.mjs
